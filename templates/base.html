<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Forensik Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css?v=7.8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111318'/><circle cx='50' cy='50' r='25' stroke='%234a90e2' stroke-width='6' fill='none'/><line x1='68' y1='68' x2='88' y2='88' stroke='%234a90e2' stroke-width='8' stroke-linecap='round'/></svg>">
    <!-- Chart.js + GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <!-- i18n must load before all other scripts -->
    <script src="/static/js/i18n.js?v=7.8"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
              <rect width="28" height="28" rx="6" fill="#111318"/>
              <path d="M7 5h9l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V6a1 1 0 011-1z" fill="#1e222b" stroke="#4a90e2" stroke-width="1"/>
              <path d="M16 5l5 5h-5V5z" fill="#4a90e2" opacity="0.6"/>
              <circle cx="13" cy="16" r="4" stroke="#4a90e2" stroke-width="1.5" fill="none"/>
              <line x1="16" y1="19" x2="20" y2="23" stroke="#4a90e2" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-title" data-i18n="app_name">PDF Forensik</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if active == 'index' %}active{% endif %}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span data-i18n="nav_analyse">Analyse</span>
            </a>
            <button id="langToggle" class="btn-lang" title="Switch to English">EN</button>
            <button id="sidebarToggle" class="btn-sidebar-toggle" title="Sidebar ein/ausblenden" style="display:none">&#9664;</button>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js?v=7.8"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
